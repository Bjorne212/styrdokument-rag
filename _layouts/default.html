<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title }} · {{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:locale" content="sv_SE">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/og.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Styrdokumentsboten: Fråga kårens styrdokument. Ett svar med källan Stadga.pdf, omgivet av styrdokument.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }} · {{ site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ '/assets/og.png' | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Visa meny">
  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <label for="menu-toggle" class="menu-button" aria-hidden="true">Meny</label>
  </header>
  <div class="layout">
    <nav class="sidebar" aria-label="Innehåll">
      <a class="brand brand-side" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <ul>
        {% for item in site.nav %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
      <a class="repo-link" href="{{ site.repository_url }}">Källkoden på GitHub</a>
    </nav>
    <main class="content">
      <article>
        {{ content }}
      </article>
      <footer class="page-footer">
        <a href="{{ site.repository_url }}/edit/gh-pages/{{ page.path }}">Föreslå en ändring av sidan</a>
        <span>CC BY 4.0, Theodor Lindberg</span>
      </footer>
    </main>
  </div>
</body>
</html>
